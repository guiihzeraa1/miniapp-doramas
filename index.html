<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini App - Dramas</title>

    <!-- Script Oficial do Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Video.js v10 (Web Components) Oficial -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body { height: 100%; }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ─── MOLDURA DO APP ─── */
        .app-shell {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh; 
            margin: 0 auto;
            background: #000;
            overflow: hidden;
            border-radius: 0 !important;
        }

        @media (min-width: 481px) {
            .app-shell { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 0 90px rgba(0, 0, 0, 0.9); }
        }

        /* ─── FEED (SEM BARRA DE ROLAGEM) ─── */
        .feed-container {
            height: 100%;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none; 
            -ms-overflow-style: none; 
        }

        .feed-container::-webkit-scrollbar { display: none; }

        .video-card {
            height: 100%;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            background-color: #000;
            overflow: hidden;
            border-radius: 0 !important;
        }

        video-player { 
            display: contents; 
            --media-border-radius: 0px !important;
            --media-control-bar-border-radius: 0px !important;
        }
        
        video-skin { 
            display: block; 
            width: 100%; 
            height: 100%; 
            --media-object-fit: cover; 
            --media-border-radius: 0px !important;
            border-radius: 0 !important; 
        }

        video { 
            width: 100%; 
            height: 100%; 
            pointer-events: auto; 
            border-radius: 0 !important; 
            -webkit-border-radius: 0 !important;
            -moz-border-radius: 0 !important;
            outline: none !important;
        }

        media-controls { position: absolute; inset: 0; pointer-events: none; transition: opacity 0.25s; }
        media-controls:not([data-visible]) { opacity: 0; }

        /* ─── INFORMAÇÕES DA SÉRIE ─── */
        .info-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px; padding-bottom: 90px; 
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            pointer-events: none;
        }
        
        .info-title {
            font-size: clamp(1.1rem, 4vw, 1.3rem); font-weight: bold; margin-bottom: 5px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9); width: 100%;
            line-height: 1.3; text-wrap: balance;
        }

        /* ─── BOTÃO EPISÓDIOS E POPUP ─── */
        .episodes-toggle {
            position: absolute; bottom: 145px; right: 16px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 8px 15px; border-radius: 20px;
            font-size: 0.9rem; font-weight: bold; cursor: pointer;
            backdrop-filter: blur(10px); pointer-events: auto; 
            transition: 0.2s; z-index: 100;
        }

        .episodes-toggle:hover { background: rgba(255, 255, 255, 0.2); }

        .episodes-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 9999;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }

        .episodes-modal.active { display: flex; }

        .modal-content {
            width: 90%; max-height: 80vh; background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px;
            padding: 20px; display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; font-size: 1.3rem; font-weight: bold; }
        .close-btn { background: none; border: none; color: rgba(255, 255, 255, 0.7); font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #fff; }

        .episodes-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 10px; overflow-y: auto; padding-right: 5px; scrollbar-width: none; -ms-overflow-style: none;
        }
        .episodes-grid::-webkit-scrollbar { display: none; }

        .ep-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
            color: white; padding: 12px 0; border-radius: 8px; cursor: pointer;
            font-size: 1rem; font-weight: bold; transition: 0.2s; text-align: center;
        }
        .ep-btn:hover { background: rgba(255, 255, 255, 0.3); }

        .ep-btn.ativo {
            background: rgb(125 96 255 / 79%);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div id="episodes-modal" class="episodes-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Episódios</h3>
                    <button class="close-btn" onclick="toggleMenu()">✕</button>
                </div>
                <div class="episodes-grid" id="episodes-grid"></div>
            </div>
        </div>
        <div class="feed-container" id="feed"></div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!--  LÓGICA PRINCIPAL DO PLAYER (SEU SISTEMA ORIGINAL)      -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tg = window.Telegram.WebApp;
            const getBody = function() { return (document.body || document.head || document.documentElement || document.doctype || document); };

            // Verificações rigorosas para garantir que está dentro do Telegram
            try { tg.ready(); } catch (e) {
                getBody().innerHTML = '<div style="color:#ff5555;background:#000;height:100vh;display:flex;align-items:center;justify-content:center;font-size:1.3rem">Acesse apenas pelo Telegram (202)</div>';
                return;
            }
            if (!tg.initData) {
                getBody().innerHTML = '<div style="color:#ff5555;background:#000;height:100vh;display:flex;align-items:center;justify-content:center;font-size:1.3rem">Acesse apenas pelo Telegram (205)</div>';
                return;
            }
            try { tg.expand(); tg.requestFullscreen(); } catch (e) {}

            const params = new URLSearchParams(window.location.search);
            const tituloSerie = params.get('titulo') ? decodeURIComponent(params.get('titulo')) : 'Série';
            const serverBase = params.get('server') ? decodeURIComponent(params.get('server')) : '';
            const epsComprimidos = params.get('eps');
            
            const chatIdSerie = params.get('chat_id') || "";
            const accessHashSerie = params.get('access_hash') || "0";
            const userId = params.get('uid') || "Desconhecido"; 

            const feedContainer = document.getElementById('feed');
            const epModal = document.getElementById('episodes-modal');
            const epGrid = document.getElementById('episodes-grid');
            let playlist = [];

            window.toggleMenu = function() { epModal.classList.toggle('active'); }

            if (epsComprimidos) {
                const listaEps = epsComprimidos.split(',');
                listaEps.forEach((epItem, index) => {
                    const partes = epItem.split('_'); 
                    if(partes.length === 3) {
                        playlist.push({
                            authUrl: `${serverBase}/autorizar/${partes[0]}?hash=${partes[1]}&chat_id=${chatIdSerie}&access_hash=${accessHashSerie}&exp=${partes[2]}&uid=${userId}`,
                            streamUrlBase: `${serverBase}/stream/${partes[0]}?chat_id=${chatIdSerie}&access_hash=${accessHashSerie}&uid=${userId}`,
                            titulo: `${tituloSerie} - Ep ${index + 1}`,
                            tokenRecebido: null
                        });
                    }
                });
            }

            playlist.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                if (index === 0) btn.classList.add('ativo');

                btn.innerText = `${index + 1}`; 
                btn.addEventListener('click', () => {
                    epModal.classList.remove('active');
                    document.getElementById(`card-ep-${index}`).scrollIntoView({ behavior: 'auto' });
                });
                epGrid.appendChild(btn);

                const card = document.createElement('div');
                card.className = 'video-card';
                card.id = `card-ep-${index}`; 
                card.setAttribute('data-index', index); 

                card.innerHTML = `
                    <video-player>
                        <video-skin>
                            <video playsinline muted preload="none"></video>
                            <media-controls>
                                <button class="episodes-toggle" onclick="toggleMenu()">☰ Episódios</button>
                                <div class="info-overlay">
                                    <div class="info-title">${item.titulo}</div>
                                </div>
                            </media-controls>
                        </video-skin>
                    </video-player>
                `;
                feedContainer.appendChild(card);
            });

            document.querySelectorAll('video').forEach((video, index) => {
                video.addEventListener('ended', () => {
                    const proximoIndex = index + 1;
                    if (proximoIndex < playlist.length) {
                        const proximoCard = document.getElementById(`card-ep-${proximoIndex}`);
                        if (proximoCard) proximoCard.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            let indexVisivelAtual = 0;
            let playTimer = null; 
            let scrollTimeout = null; 

            const observer = new IntersectionObserver((entries) => {
                let mudou = false;
                entries.forEach(entry => {
                    if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                        indexVisivelAtual = parseInt(entry.target.getAttribute('data-index'));
                        mudou = true;
                    }
                });
                
                if (mudou) {
                    document.querySelectorAll('.ep-btn').forEach((btn, idx) => {
                        if (idx === indexVisivelAtual) {
                            btn.classList.add('ativo');
                        } else {
                            btn.classList.remove('ativo');
                        }
                    });

                    if (scrollTimeout) clearTimeout(scrollTimeout);
                    scrollTimeout = setTimeout(() => {
                        sincronizarFilaDeVideos();
                    }, 300); 
                }
            }, { root: feedContainer, threshold: 0.6 });

            async function carregarVideoUnico(videoEl, playlistItem) {
                if (!videoEl || !playlistItem) return;
                if (videoEl.getAttribute('src')) return;

                try {
                    if (!playlistItem.tokenRecebido) {
                        const resposta = await fetch(playlistItem.authUrl);
                        if (!resposta.ok) {
                            console.error("Servidor recusou o acesso", resposta.status);
                            return;
                        }
                        playlistItem.tokenRecebido = await resposta.text();
                    }
                    videoEl.setAttribute('src', `${playlistItem.streamUrlBase}&token=${playlistItem.tokenRecebido}`);
                    videoEl.load();
                } catch (e) {
                    console.log("Falha ao se conectar com o servidor.", e);
                }
            }

            function sincronizarFilaDeVideos() {
                playlist.forEach((item, index) => {
                    const card = document.getElementById(`card-ep-${index}`);
                    if (!card) return;
                    const video = card.querySelector('video');
                    if (!video) return;

                    if (index === indexVisivelAtual) {
                        if (window.playTimer) clearTimeout(window.playTimer);
                        
                        carregarVideoUnico(video, item).then(() => {
                            window.playTimer = setTimeout(() => {
                                video.muted = true;
                                const playPromise = video.play();
                                
                                if (playPromise !== undefined) {
                                    playPromise.then(() => {
                                        setTimeout(() => { video.muted = false; }, 800);
                                    }).catch(err => console.log("O celular bloqueou autoplay no mudo:", err));
                                }
                            }, 400); 
                        });
                        
                    } else if (index === indexVisivelAtual + 1) {
                        video.pause();
                        video.muted = true;
                        carregarVideoUnico(video, item);
                    } else {
                        video.pause();
                        if (video.getAttribute('src')) {
                            video.removeAttribute('src');
                            video.load(); 
                        }
                    }
                });
            }

            document.querySelectorAll('.video-card').forEach(card => observer.observe(card));
        });
    </script>


    <!-- ═══════════════════════════════════════════════════════ -->
    <!--     SCRIPTS DE SEGURANÇA (ANTI-INSPECIONAR / ANTI-PC)   -->
    <!-- ═══════════════════════════════════════════════════════ -->
    
    <!-- 1. BLOQUEIO DE DEVTOOLS E CONSOLE (INSPECIONAR ELEMENTO) -->
    <script>
    try {
        document.onkeydown = function(e) {
            var d = 0;
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) { d = 1; } 
            else if (e.ctrlKey && e.shiftKey && e.keyCode === 67) { d = 2; } 
            else if (e.ctrlKey && e.shiftKey && e.keyCode === 75) { d = 3; } 
            else if (e.ctrlKey && e.shiftKey && e.keyCode === 90) { d = 4; } 
            else if (e.ctrlKey && e.shiftKey && e.keyCode === 69) { d = 5; } 
            else if (e.ctrlKey && e.shiftKey && e.keyCode === 74) { d = 6; } 
            else if (e.ctrlKey && e.shiftKey && e.keyCode === 77) { d = 7; } 
            else if (e.ctrlKey && e.keyCode === 80) { d = 8; } 
            else if (e.ctrlKey && e.keyCode === 83) { d = 9; } 
            else if (e.ctrlKey && e.keyCode === 85) { d = 10; } 
            else if (e.shiftKey && e.keyCode === 118) { d = 11; } 
            else if (e.shiftKey && e.keyCode === 116) { d = 12; } 
            else if (e.shiftKey && e.keyCode === 120) { d = 13; } 
            else if (e.shiftKey && e.keyCode === 123) { d = 14; } 
            else if (e.keyCode === 123) { d = 15; }
            
            if (d !== 0) {
                if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
                document.body.innerHTML = '';
                window.location.href = 'https://www.google.com/?b=2&d=' + String(d);
                return false;
            }
        };

        document.oncontextmenu = function(e) {
            if (e.target.nodeName === 'A') { return; }
            if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
            document.body.innerHTML = '';
            window.location.href = 'https://www.google.com/?b=3';
            return false;
        };

        (function() {
            var d = 0;
            if (typeof window.Image !== 'function') { d = 2; } 
            else if (typeof window.Image.toString !== 'function') { d = 3; } 
            else if (window.Image.toString() !== 'function Image() { [native code] }' && window.Image.toString() !== 'function Image() {\n    [native code]\n}') { d = 4; } 
            else if (typeof window.Image.prototype !== 'object') { d = 5; } 
            else if (!window.Image.prototype) { d = 6; } 
            else if (typeof window.Image.prototype.__defineGetter__ !== 'function') { d = 7; } 
            else if (typeof window.Image.prototype.__defineGetter__.toString !== 'function') { d = 8; } 
            else if (window.Image.prototype.__defineGetter__.toString() !== 'function __defineGetter__() { [native code] }' && window.Image.prototype.__defineGetter__.toString() !== 'function __defineGetter__() {\n    [native code]\n}') { d = 9; }
            
            if (d) {
                if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
                document.body.innerHTML = '';
                window.location.href = 'https://www.google.com/?b=4&d=' + String(d);
                return false;
            }

            d = 0;
            if (typeof window.console !== 'object') { d = 2; } 
            else if (!window.console) { d = 3; } 
            else if (typeof window.console.log !== 'function') { d = 4; } 
            else if (typeof window.console.log.toString !== 'function') { d = 5; } 
            else if (window.console.log.toString() !== 'function log() { [native code] }' && window.console.log.toString() !== 'function log() {\n    [native code]\n}') { d = 6; }
            
            if (d) {
                if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
                document.body.innerHTML = '';
                window.location.href = 'https://www.google.com/?b=5&d=' + String(d);
                return false;
            }

            var i = new Image();
            var alerted = false;
            i.__defineGetter__('id', function() {
                if (!alerted) { console.log('inspecionou'); }
                d = 1;
            });

            setInterval(function() {
                d = 0;
                if (typeof window.console !== 'object') { d = 2; } 
                else if (!window.console) { d = 3; } 
                else if (typeof window.console.log !== 'function') { d = 4; } 
                else if (typeof window.console.log.toString !== 'function') { d = 5; } 
                else if (window.console.log.toString() !== 'function log() { [native code] }' && window.console.log.toString() !== 'function log() {\n    [native code]\n}') { d = 6; } 
                else {
                    window.console.log(i);
                    window.console.clear();
                }
                if (d) {
                    if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
                    document.body.innerHTML = '';
                    window.location.href = 'https://www.google.com/?b=6&d=' + String(d);
                    return false;
                }
            }, 500);

            const devtools = { isOpen: false, orientation: undefined, };
            const threshold = 160;
            const emitEvent = (isOpen, orientation) => {
                globalThis.dispatchEvent(new globalThis.CustomEvent('devtoolschange', {
                    detail: { isOpen, orientation, },
                }));
            };

            const main = ({emitEvents = true} = {}) => {
                const widthThreshold = globalThis.outerWidth - globalThis.innerWidth > threshold;
                const heightThreshold = globalThis.outerHeight - globalThis.innerHeight > threshold;
                const orientation = widthThreshold ? 'vertical' : 'horizontal';
                if (!(heightThreshold && widthThreshold) && ((globalThis.Firebug && globalThis.Firebug.chrome && globalThis.Firebug.chrome.isInitialized) || widthThreshold || heightThreshold)) {
                    if ((!devtools.isOpen || devtools.orientation !== orientation) && emitEvents) { emitEvent(true, orientation); }
                    devtools.isOpen = true;
                    devtools.orientation = orientation;
                } else {
                    if (devtools.isOpen && emitEvents) { emitEvent(false, undefined); }
                    devtools.isOpen = false;
                    devtools.orientation = undefined;
                }
            };

            main({emitEvents: false});
            setInterval(main, 500);

            window.addEventListener('devtoolschange', function(event) {
                if (!event.detail.isOpen) { return; }
                if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
                document.body.innerHTML = '';
                window.location.href = 'https://www.google.com/?b=6&d=7';
                return false;
            });

            var o = function() {};
            setInterval(function() {
                if (!o()) { return; }
                if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
                document.body.innerHTML = '';
                window.location.href = 'https://www.google.com/?b=7';
                return false;
            }, 2000);
        })();
    } catch (e) {
        if (typeof window.close !== 'undefined' && window.close) { try { window.close(); } catch (e) {} }
        document.body.innerHTML = '';
        window.location.href = 'https://www.google.com/?b=8';
    }
    </script>

    <!-- 2. BLOQUEIO DE REDIMENSIONAMENTO FORÇADO (COMPUTADOR EXTERNO - CORREÇÃO iPHONE) -->
    <script>
    const isMobile = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    if (!isMobile) {
        setInterval(() => {
            if ((window.outerWidth - window.innerWidth) > 160 || (window.outerHeight - window.innerHeight) > 160) {
                document.body.innerHTML = '<div style="color:#ff5555;background:#000;height:100vh;display:flex;align-items:center;justify-content:center;font-size:1.3rem">Acesse apenas pelo Telegram (101)</div>';
            }
            const t = performance.now(); debugger; 
            if (performance.now() - t > 100) {
                document.body.innerHTML = '<div style="color:#ff5555;background:#000;height:100vh;display:flex;align-items:center;justify-content:center;font-size:1.3rem">Acesse apenas pelo Telegram (102)</div>';
            }
        }, 1200);
    }

    document.oncontextmenu = e => e.preventDefault();
    document.onkeydown = e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && 'IJC'.includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
            e.preventDefault();
        }
    };
    </script>
</body>
</html>
